<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ccff"/>
      <stop offset="50%" style="stop-color:#aa66ff"/>
      <stop offset="100%" style="stop-color:#ff4488"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <!-- Musical note (eighth note) -->
  <g fill="url(#grad)">
    <!-- Note head -->
    <ellipse cx="24" cy="42" rx="7" ry="5.5" transform="rotate(-20 24 42)"/>
    <!-- Stem -->
    <rect x="29.5" y="14" width="3" ry="1.5" height="28"/>
    <!-- Flag -->
    <path d="M 32.5 14 Q 42 16 44 22 Q 46 28 40 30 Q 44 24 40 20 Q 36 16 32.5 16 Z"/>
  </g>
  <!-- Small second note for depth -->
  <g fill="url(#grad)" opacity="0.4">
    <ellipse cx="42" cy="46" rx="5" ry="4" transform="rotate(-15 42 46)"/>
    <rect x="45.5" y="26" width="2.5" ry="1.25" height="20"/>
  </g>
</svg>
